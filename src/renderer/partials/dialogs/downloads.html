<!-- Téléchargements --------------------------------------------------- -->
<dialog
  id="downloads-dialog"
  class="modal modal--wide"
  aria-labelledby="downloads-title"
>
  <header class="modal__header">
    <div>
      <p class="eyebrow">Fichiers</p>
      <h2 id="downloads-title">Téléchargements</h2>
    </div>
    <button
      class="icon-button modal__close"
      type="button"
      data-close-dialog
      aria-label="Fermer les téléchargements"
      title="Fermer"
    >
      <span aria-hidden="true">×</span>
    </button>
  </header>

  <div class="modal__body">
    <div class="modal__toolbar">
      <p id="downloads-count" class="modal__meta">
        Aucun téléchargement
      </p>
    </div>
    <div id="downloads-list" class="download-list"></div>
  </div>
</dialog>
