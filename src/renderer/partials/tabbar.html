<!-- Barre d'onglets --------------------------------------------------- -->
<header class="tabbar">
  <div
    class="tabbar__brand"
    title="Think-Browser"
    aria-label="Think-Browser"
  >
    <img
      class="brand__logo"
      src="../../assets/icons/app.svg"
      alt=""
      width="22"
      height="24"
    />
  </div>

  <div class="tabs-viewport">
    <div
      id="tabs-list"
      class="tabs-list"
      role="tablist"
      aria-label="Onglets ouverts"
    ></div>
  </div>

  <button
    id="new-tab-button"
    class="new-tab-button"
    type="button"
    title="Nouvel onglet (Ctrl+T)"
    aria-label="Ouvrir un nouvel onglet"
  >
    <span aria-hidden="true">+</span>
  </button>
</header>
